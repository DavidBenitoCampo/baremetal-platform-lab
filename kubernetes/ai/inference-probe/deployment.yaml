apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-inference-probe
  labels:
    app.kubernetes.io/name: ollama-inference-probe
    app.kubernetes.io/part-of: baremetal-platform-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-inference-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-inference-probe
        app.kubernetes.io/part-of: baremetal-platform-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: python:3.12.15-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
          imagePullPolicy: IfNotPresent
          command: [python, -B, -u, /opt/probe/probe.py]
          env:
            - name: OLLAMA_URL
              value: http://ollama.ai-lab.svc.cluster.local:11434
            - name: OLLAMA_MODEL
              value: qwen2.5:0.5b
            - name: PROBE_INTERVAL_SECONDS
              value: "60"
            - name: PROBE_TIMEOUT_SECONDS
              value: "15"
          ports:
            - name: metrics
              containerPort: 9189
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 2
          volumeMounts:
            - name: code
              mountPath: /opt/probe
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: ollama-inference-probe-code
