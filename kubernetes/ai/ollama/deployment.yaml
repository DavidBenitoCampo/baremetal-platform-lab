apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-lab
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: baremetal-platform-lab
spec:
  replicas: 1
  # Accept downtime rather than run a second model server during updates.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: baremetal-platform-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: pi-lab
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          # Version tag, not an immutable digest. Record imageID after pulling.
          image: ollama/ollama:0.40.0
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - name: http
              containerPort: 11434
          env:
            # Container home only. The workstation's HOME is unchanged.
            - name: HOME
              value: /var/lib/ollama
            - name: OLLAMA_MODELS
              value: /var/lib/ollama/models
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_NO_CLOUD
              value: "1"
            - name: OLLAMA_VULKAN
              value: "0"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "2048"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_QUEUE
              value: "4"
            - name: OLLAMA_KEEP_ALIVE
              value: 5m
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # These check the HTTP server, not whether a model answers prompts.
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /var/lib/ollama
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ollama-cache
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
