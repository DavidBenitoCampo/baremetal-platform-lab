apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-deny-ingress
  namespace: ai-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes:
    - Ingress
  # Deny Pod-network clients. Administrative port-forwarding is the access path.
  # Outbound DNS and HTTPS remain available for the initial public model pull.
  ingress: []
