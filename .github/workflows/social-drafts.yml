name: Social drafts

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Which prepared post to use
        type: choice
        options:
          - introduction
          - flux-recovery
        default: flux-recovery
        required: true
      channel:
        description: Social channel to preview or draft
        type: choice
        options:
          - linkedin
          - bluesky
          - both
        default: both
        required: true
      action:
        description: Preview only or create drafts in Buffer
        type: choice
        options:
          - preview
          - create-draft
        default: preview
        required: true

permissions:
  contents: read

jobs:
  social-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and preview post
        env:
          SELECTED_TOPIC: ${{ inputs.topic }}
          SELECTED_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/buffer_drafts.py --topic "$SELECTED_TOPIC" --channel "$SELECTED_CHANNEL"

      - name: Create Buffer drafts for manual review
        if: inputs.action == 'create-draft'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SELECTED_TOPIC: ${{ inputs.topic }}
          SELECTED_CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/buffer_drafts.py --topic "$SELECTED_TOPIC" --channel "$SELECTED_CHANNEL" --create-draft
