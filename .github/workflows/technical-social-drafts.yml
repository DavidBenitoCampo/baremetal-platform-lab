name: Technical social drafts

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  create-draft:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'social-ready')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Generate and save LinkedIn draft
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/pr_social_draft.py --create-draft
