<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1730" viewBox="0 0 1720 1730" role="img" aria-labelledby="title description">
  <title id="title">baremetal-platform-lab: current baseline and planned AI platform architecture</title>
  <desc id="description">Architecture as of 7 October 2026. Solid teal outlines and RUNNING labels identify verified components. A workstation uses Ansible over SSH and kubectl against a single-node K3s server. LAN HTTP traffic passes through Traefik, a ClusterIP Service and two Podinfo replicas. The Raspberry Pi boots from a USB-connected ADATA SU650 SSD and uses a SQLite datastore. Dashed amber outlines and PLANNED labels identify additions: GitHub CI, one GitOps controller, private Ollama inference with a small CPU model and an SSD-backed local-path model cache, Prometheus, a Blackbox exporter, Grafana, Alertmanager and independent off-Pi backups. The GitOps controller pulls reviewed manifests from Git and reconciles them through the Kubernetes API. Ollama is reached using kubectl port-forward through the API, not through Ingress. Prometheus scrapes Podinfo and the Blackbox exporter. Blackbox probes the Ingress, Grafana queries Prometheus and Prometheus sends alerts to Alertmanager. Backup and restore cover K3s control-plane state, server token and configuration. All workloads and local monitoring share one physical failure domain. Multiple application Pods are not host-level high availability.</desc>
