  <text x="1142" y="1360" text-anchor="middle" class="planned-label">alerts</text>
  <path d="M 961 1414 V 1460 H 1632 V 800 H 1594" class="planned-path"/>
  <text x="1270" y="1446" text-anchor="middle" class="planned-label">scrape Podinfo /metrics</text>

  <text x="478" y="1501" class="body" style="font-weight:700">A Pi or SSD failure stops the application, control plane and all local monitoring.</text>

  <text x="64" y="1588" class="section">Recovery scope</text>
  <text x="64" y="1620" class="body">First restore: K3s control-plane state, server token and configuration.</text>
  <text x="64" y="1647" class="body">Application data and monitoring history are outside the first backup test.</text>
  <text x="64" y="1674" class="body">Model weights are a cache. Re-download them after storage loss.</text>

  <text x="1044" y="1588" class="section">AI work comes next</text>
  <text x="1044" y="1620" class="body">Start with inference, resource limits and recovery tests.</text>
  <text x="1044" y="1647" class="body">Add a read-only agent afterwards, with bounded access.</text>
  <text x="1044" y="1674" class="body">Two Pods on one Pi are not host-level high availability.</text>
</svg>
