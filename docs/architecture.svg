<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1510" viewBox="0 0 1440 1510" role="img" aria-labelledby="title desc">
<title id="title">Baremetal platform lab architecture</title>
<desc id="desc">Repository architecture reviewed 23 October 2026. GitHub CI gates main and Flux reconciles five configurations on one Pi. Private Ollama inference, Podinfo, Prometheus and Grafana share SSD storage. A workstation holds encrypted K3s backups. External monitoring, notifications and a read-only assistant remain planned.</desc>
<defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#183044}.title{font-size:34px;font-weight:bold}.head{font-size:21px;font-weight:bold}.body{font-size:16px}.small{font-size:14px;fill:#4a6173}.box{fill:white;stroke:#277d71;stroke-width:2}.future{fill:#fffcf6;stroke:#ad7422;stroke-width:2;stroke-dasharray:7 5}.line{fill:none;stroke:#277d71;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#277d71"/></marker></defs>
<rect width="1440" height="1510" fill="#fff"/>
<text x="50" y="65" class="title">baremetal-platform-lab</text>
<text x="50" y="100" class="body">Repository reviewed 23 October 2026. Runtime results are operator-reported.</text>
<rect x="50" y="135" width="650" height="155" rx="12" class="box"/>
<text x="70" y="169" class="head">GitHub repository and CI</text>
<text x="70" y="200" class="body">PR required; validate must pass; branch up to date</text>
<text x="70" y="226" class="body">Flux schemas and rendered image digests checked</text>
<text x="70" y="252" class="body">No cluster credentials in CI</text>
<rect x="740" y="135" width="650" height="155" rx="12" class="box"/>
<text x="760" y="169" class="head">Workstation and independent backup disk</text>
<text x="760" y="200" class="body">Tailscale + SSH key; API and Podinfo managed tunnels</text>
<text x="760" y="226" class="body">Ollama, Prometheus, Grafana via private port-forwards</text>
<text x="760" y="252" class="body">Encrypted K3s state archive; one backup destination</text>
<rect x="50" y="350" width="1340" height="830" rx="18" fill="#f1f6f8" stroke="#8d9eac" stroke-width="2"/>
<text x="75" y="390" class="head">ONE PI · Ubuntu ARM64 · Pi 5 / 8 GB · USB SATA SSD</text>
<rect x="80" y="425" width="600" height="145" rx="12" class="box"/>
<text x="100" y="459" class="head">Flux 2.9.6</text>
<text x="100" y="490" class="body">Four controllers, pinned through Kustomize images</text>
<text x="100" y="516" class="body">Five Kustomizations follow main</text>
<text x="100" y="542" class="body">flux-system, podinfo, ollama, probe, monitoring</text>
<rect x="740" y="425" width="620" height="145" rx="12" class="box"/>
<text x="760" y="459" class="head">K3s v1.36.5+k3s1</text>
<text x="760" y="490" class="body">Single server; SQLite; Secrets encryption</text>
<text x="760" y="516" class="body">Traefik + local-path provisioner</text>
<text x="760" y="542" class="body">Control plane and workloads share one host</text>
<path d="M375 290 V325 H715 V410 H375 V425" class="line"/>
<text x="390" y="325" class="small">Flux pulls main</text>
<path d="M680 495 H740" class="line"/>
<rect x="80" y="610" width="395" height="195" rx="12" class="box"/>
<text x="100" y="644" class="head">platform-demo</text>
<text x="100" y="675" class="body">Traefik → Service → Podinfo</text>
<text x="100" y="701" class="body">Podinfo 6.15.0; two replicas</text>
<text x="100" y="727" class="body">Readiness + rolling updates</text>
<text x="100" y="753" class="body">Both replicas share this Pi</text>
<rect x="505" y="610" width="420" height="195" rx="12" class="box"/>
<text x="525" y="644" class="head">ai-lab</text>
<text x="525" y="675" class="body">Ollama 0.40.0; qwen2.5:0.5b</text>
<text x="525" y="701" class="body">CPU inference; one parallel request</text>
<text x="525" y="727" class="body">Probe runs once per minute</text>
<text x="525" y="753" class="body">NetworkPolicy restricts clients</text>
<rect x="955" y="610" width="405" height="195" rx="12" class="box"/>
<text x="975" y="644" class="head">monitoring</text>
<text x="975" y="675" class="body">Prometheus 3.15.0</text>
<text x="975" y="701" class="body">kube-state-metrics 2.20.0</text>
<text x="975" y="727" class="body">Grafana 13.2.2</text>
<text x="975" y="753" class="body">Alert rules and dashboards in Git</text>
<text x="95" y="850" class="head">Traffic and observation paths</text>
<text x="95" y="885" class="body">Workstation → Tailscale / SSH → Kubernetes API or Traefik; no public Ollama Ingress</text>
<text x="95" y="920" class="body">Inference probe → Ollama; Prometheus → probe metrics and kube-state-metrics</text>
<text x="95" y="955" class="body">Grafana → Prometheus; alert firing observed locally, notification delivery pending</text>
<rect x="80" y="995" width="1280" height="150" rx="12" class="box"/>
<text x="100" y="1029" class="head">One SSD: operating system, SQLite, and local-path volumes</text>
<text x="100" y="1060" class="body">Ollama model cache: 20 GiB; Prometheus: 5 GiB; Grafana: 2 GiB requested</text>
<text x="100" y="1086" class="body">Local-path PVC sizes do not enforce filesystem quotas. No replicated storage.</text>
<text x="100" y="1112" class="body">Backup covers K3s state and credentials. Application volumes and OS are outside the tested restore.</text>
<rect x="50" y="1220" width="650" height="155" rx="12" class="future"/>
<text x="70" y="1254" class="head">Planned</text>
<text x="70" y="1285" class="body">Independent availability checks and host metrics</text>
<text x="70" y="1311" class="body">Alertmanager and notification delivery</text>
<text x="70" y="1337" class="body">Read-only assistant with scoped identity</text>
<rect x="740" y="1220" width="650" height="155" rx="12" class="future"/>
<text x="760" y="1254" class="head">Remaining verification</text>
<text x="760" y="1285" class="body">Six HTTP timeouts remain unexplained</text>
<text x="760" y="1311" class="body">Successful version rollout with continuous HTTP</text>
<text x="760" y="1337" class="body">VPN reboot / denial and wider policy tests</text>
<text x="50" y="1425" class="head">A Pi, power, or SSD failure affects every workload and local monitoring.</text>
<text x="50" y="1460" class="small">Solid boxes: implemented. Dashed boxes: future work. Two replicas provide no host-level high availability.</text>
</svg>
