apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama-inference-probe
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  path: ./kubernetes/ai/inference-probe
  dependsOn:
    - name: ollama
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  timeout: 3m
