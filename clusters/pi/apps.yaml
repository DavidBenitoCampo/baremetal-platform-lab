---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1m
  path: ./kubernetes/overlays/pi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: podinfo
      namespace: platform-demo
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ollama
  namespace: flux-system
spec:
  interval: 1m
  path: ./kubernetes/ai/ollama
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ollama
      namespace: ai-lab
