# Talos machine config patch: Raspberry Pi 5 hardware specifics.
#
# Applied to every machine (control plane and worker) that runs on a Pi 5.
# Non-secret: safe to commit. Used with `talosctl gen config --config-patch @talos/patches/pi5.yaml`.
#
# Pi 5 boots via the pftf/RPi5 UEFI firmware rather than a Talos SBC overlay
# (unlike the Pi 4, which needs the `rpi_generic` overlay). Because of that,
# the installer image below is a plain metal-arm64 image from Image Factory
# with no board-specific schematic required. Verify this is still current
# against https://www.talos.dev/latest/talos-guides/install/single-board-computers/
# before flashing — SBC support has changed across Talos releases.
machine:
  install:
    # Replace with the real target disk once known. In maintenance mode, run
    # `talosctl get disks --insecure -n <maintenance-ip>` to see what the Pi
    # enumerates (commonly /dev/nvme0n1 for NVMe, /dev/mmcblk0 for SD card).
    disk: /dev/nvme0n1
    # Build this at https://factory.talos.dev (Metal / arm64, no overlay) and
    # pin it to the Talos version you're actually running.
    image: factory.talos.dev/metal-installer/<SCHEMATIC_ID>:v1.8.0
  time:
    servers:
      - time.cloudflare.com
