# Talos machine config patch: Raspberry Pi 5 hardware specifics.
#
# Applied to every machine (control plane and worker) that runs on a Pi 5.
# Non-secret: safe to commit. Used with `talosctl gen config --config-patch @talos/patches/pi5.yaml`.
#
# Install settings used to live here, in the v1alpha1 `.machine.install`
# section. Talos v1.14 deprecated that in favour of the UnattendedInstallConfig
# document — see talos/patches/install.yaml. Setting both is a validation
# error, so only v1alpha1-native settings remain in this file.
#
# The image itself must be built at https://factory.talos.dev with the
# `rpi_5` overlay (siderolabs/sbc-raspberrypi) — not `rpi_generic`, which is
# the Pi 4 profile. The wrong overlay produces a boot that stalls at the
# U-Boot logo with no network; see ADR-002 for the history.
machine:
  time:
    servers:
      - time.cloudflare.com
