# Talos machine config patch: Raspberry Pi 5 hardware specifics.
#
# Applied to every machine (control plane and worker) that runs on a Pi 5.
# Non-secret: safe to commit. Used with `talosctl gen config --config-patch @talos/patches/pi5.yaml`.
#
# Requires the dedicated `rpi_5` overlay when building the image at
# https://factory.talos.dev (siderolabs/sbc-raspberrypi, profile `rpi_5`) —
# NOT the generic `rpi_generic` overlay used for the Pi 4, and not a
# no-overlay image. The `rpi_5` profile replaces the Pi firmware repo's
# downstream DTBs with upstream-kernel ones, which is what actually fixes
# Ethernet — see https://github.com/siderolabs/sbc-raspberrypi/pull/71.
# The wrong overlay reproduces a "stuck at the U-Boot logo, black screen,
# no network" boot (see ADR-002's history) — verify against
# https://docs.siderolabs.com/talos/latest/platform-specific-installations/single-board-computers/
# before flashing, since SBC support keeps moving.
machine:
  install:
    # Replace with the real target disk once known. In maintenance mode, run
    # `talosctl get disks --insecure -n <maintenance-ip>` to see what the Pi
    # enumerates. With an external USB SSD as boot/install media this is
    # typically /dev/sda; NVMe would be /dev/nvme0n1, SD card /dev/mmcblk0.
    disk: /dev/sda
    # Build this at https://factory.talos.dev with overlay `rpi_5` and pin
    # it to the Talos version you're actually running.
    image: factory.talos.dev/metal-installer/a636242df247ad4aad2e36d1026d8d4727b716a3061749bd7b19651e548f65e4:v1.14.0
  time:
    servers:
      - time.cloudflare.com
