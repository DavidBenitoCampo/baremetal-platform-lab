# Talos machine config patch: control-plane role, Milestone 1 single-node cluster.
#
# Non-secret: safe to commit. Used with
# `talosctl gen config --config-patch-control-plane @talos/patches/controlplane.yaml`.
#
# Two settings that used to live here have moved in Talos v1.14 and were
# removed rather than duplicated, since setting both forms fails validation:
#
#   - `machine.network.hostname` -> the HostnameConfig document, which
#     defaults to `auto: stable`. Left at the default; the hostname is
#     cosmetic for a single node.
#   - `cluster.allowSchedulingOnControlPlanes` -> expressed as a taint in
#     KubeNodeConfig (`node-role.kubernetes.io/control-plane: NoSchedule`).
#     Removing that taint is what allows workloads to schedule here, and is
#     needed before Milestone 2 deploys anything.
machine:
  certSANs:
    # Every address the API server may be reached on, now or later. These are
    # baked into the PKI at `talosctl gen config` time and can't be added
    # afterwards without regenerating certificates — so the future VLAN 20
    # address (Milestone 3) is listed up front to avoid a regeneration when
    # the node moves networks.
    - 10.0.1.16      # current LAN address (O2 Smart Box DHCP reservation)
    - 10.0.1.200     # spare, outside the router's 10.0.1.10-137 DHCP pool,
                     # in case this node moves to a static address
    - 10.10.20.10    # planned VLAN 20 address, Milestone 3
    - pi5-cp-01
