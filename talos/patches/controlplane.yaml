# Talos machine config patch: control-plane role, Milestone 1 single-node cluster.
#
# Non-secret: safe to commit. Used with
# `talosctl gen config --config-patch-control-plane @talos/patches/controlplane.yaml`.
#
# This exists only because there is exactly one node right now and it must
# run both the control plane and workloads. Milestone 6 (multi-node) should
# drop `allowSchedulingOnControlPlanes` once dedicated workers exist.
machine:
  network:
    hostname: pi5-cp-01
  certSANs:
    # Every address the API server may be reached on, now or later. These are
    # baked into the PKI at `talosctl gen config` time and can't be added
    # afterwards without regenerating certificates — so the future VLAN 20
    # address (Milestone 3) is listed up front to avoid a regeneration when
    # the node moves networks.
    - 10.0.1.16      # current LAN address (DHCP reservation)
    - 10.10.20.10    # planned VLAN 20 address, Milestone 3
    - pi5-cp-01
cluster:
  allowSchedulingOnControlPlanes: true
