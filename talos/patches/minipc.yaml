# Talos machine config patch: x86_64 UEFI mini PC hardware specifics.
#
# Applied to every machine (control plane and worker) that runs on the mini
# PC fleet. Non-secret: safe to commit. Used with
# `talosctl gen config --config-patch @talos/patches/minipc.yaml`.
#
# Supersedes the original Raspberry Pi 5 patch — see ADR-002's 2026-09-09
# update. Stock Talos images can't yet bring up Ethernet on the Pi 5's RP1
# southbridge; a plain x86_64 UEFI mini PC uses Talos' standard Metal
# installer instead: no SBC overlay, no custom kernel.
machine:
  install:
    # Replace with the real target disk once known. In maintenance mode, run
    # `talosctl get disks --insecure -n <maintenance-ip>` to see what the box
    # enumerates (commonly /dev/nvme0n1 for NVMe, /dev/sda for SATA/USB).
    disk: /dev/nvme0n1
    # Build this at https://factory.talos.dev (Metal / amd64, no overlay) and
    # pin it to the Talos version you're actually running.
    image: factory.talos.dev/metal-installer/<SCHEMATIC_ID>:v1.8.0
  time:
    servers:
      - time.cloudflare.com
